name: Windows release build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dme-release
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Qt 6.10.2
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.2'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true
          cache-key-prefix: dme-qt-6.10.2-msvc2022

      - name: Build the release package
        shell: pwsh
        run: |
          cmake -S . -B build/github-actions `
            -G "Visual Studio 17 2022" -A x64 `
            "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR" `
            -DDME_BUILD_CHANNEL=stable
          if ($LASTEXITCODE -ne 0) {
            throw "CMake configuration failed with exit code $LASTEXITCODE."
          }

          cmake --build build/github-actions --config Release `
            --target package_all --parallel
          if ($LASTEXITCODE -ne 0) {
            throw "Release packaging failed with exit code $LASTEXITCODE."
          }

      - name: Create the update manifest
        shell: pwsh
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          $archive = Get-Item "release/DewralMapEditor-windows-x64.zip"
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive.FullName).Hash.ToLowerInvariant()
          $sourceArchive = Get-Item "release/DewralMapEditor-source.zip"
          $sourceHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $sourceArchive.FullName).Hash.ToLowerInvariant()
          $cmake = Get-Content "CMakeLists.txt" -Raw
          if ($cmake -notmatch 'project\(DewralMapEditor VERSION ([0-9]+\.[0-9]+\.[0-9]+)') {
            throw "The DME version could not be read from CMakeLists.txt."
          }
          $version = $Matches[1]
          $downloadUrl = "https://github.com/$env:REPOSITORY/releases/download/1.0/DewralMapEditor-windows-x64.zip"
          $releaseUrl = "https://github.com/$env:REPOSITORY/releases/tag/1.0"
          $manifest = [ordered]@{
            schemaVersion = 1
            channel = "stable"
            version = $version
            commit = $env:COMMIT_SHA
            publishedAt = (Get-Date).ToUniversalTime().ToString("o")
            downloadUrl = $downloadUrl
            releasePageUrl = $releaseUrl
            sha256 = $hash
            size = $archive.Length
            notes = "Current Dewral Map Editor build from commit $($env:COMMIT_SHA.Substring(0, 12))."
          }
          $manifest | ConvertTo-Json | Set-Content -Encoding utf8NoBOM "release/update-manifest.json"
          @(
            "$hash  DewralMapEditor-windows-x64.zip"
            "$sourceHash  DewralMapEditor-source.zip"
          ) | Set-Content -Encoding ascii "release/SHA256SUMS.txt"
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Update the main release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(
            "release/DewralMapEditor-windows-x64.zip",
            "release/DewralMapEditor-source.zip",
            "release/update-manifest.json",
            "release/SHA256SUMS.txt"
          )
          $shortCommit = $env:GITHUB_SHA.Substring(0, 12)
          $notes = @"
          ## Dewral Map Editor 1.0

          Current Windows x64 build of Dewral Map Editor from the **main** branch.

          - **Version:** $env:RELEASE_VERSION
          - **Commit:** $shortCommit

          Download **DewralMapEditor-windows-x64.zip** from the Assets section below.
          "@
          gh release view 1.0 --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            git tag --force 1.0 $env:GITHUB_SHA
            git push origin refs/tags/1.0 --force
            if ($LASTEXITCODE -ne 0) { throw "Moving the release tag failed." }
            gh release edit 1.0 --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Dewral Map Editor 1.0" --latest
            if ($LASTEXITCODE -ne 0) { throw "Updating the release metadata failed." }
            gh release upload 1.0 @assets --repo $env:GITHUB_REPOSITORY --clobber
            if ($LASTEXITCODE -ne 0) { throw "Uploading the release assets failed." }
          } else {
            gh release create 1.0 @assets --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Dewral Map Editor 1.0" --notes $notes --latest
            if ($LASTEXITCODE -ne 0) { throw "Creating the release failed." }
          }
