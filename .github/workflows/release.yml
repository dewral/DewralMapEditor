name: Windows stable release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dme-release
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Qt 6.10.2
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.2'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: 'qtshadertools'
          cache: true
          cache-key-prefix: dme-qt-6.10.2-msvc2022-shadertools

      - name: Build the release package
        shell: pwsh
        run: |
          cmake -S . -B build/github-actions `
            -G "Visual Studio 17 2022" -A x64 `
            "-DCMAKE_PREFIX_PATH=$env:QT_ROOT_DIR" `
            "-DDME_RELEASE_REPOSITORY=$env:GITHUB_REPOSITORY"
          if ($LASTEXITCODE -ne 0) {
            throw "CMake configuration failed with exit code $LASTEXITCODE."
          }

          cmake --build build/github-actions --config Release `
            --target package_all --parallel
          if ($LASTEXITCODE -ne 0) {
            throw "Release packaging failed with exit code $LASTEXITCODE."
          }

          ctest --test-dir build/github-actions -C Release -R '^release_manifest$' --output-on-failure
          if ($LASTEXITCODE -ne 0) {
            throw "Release manifest validation failed with exit code $LASTEXITCODE."
          }

      - name: Read the packaged release version
        shell: pwsh
        run: |
          $manifest = Get-Content "release/update-manifest.json" -Raw | ConvertFrom-Json
          "RELEASE_VERSION=$($manifest.version)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Update the main release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(
            "release/DewralMapEditor-windows-x64.zip",
            "release/DewralMapEditor-source.zip",
            "release/SHA256SUMS.txt"
          )
          $notes = @"
          ## Dewral Map Editor $env:RELEASE_VERSION

          Stable Windows x64 release of Dewral Map Editor.

          - **Version:** $env:RELEASE_VERSION

          Download **DewralMapEditor-windows-x64.zip** from the Assets section below.
          "@
          $notes | Set-Content -Encoding utf8NoBOM "release/release-notes.md"
          gh release view 1.0 --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            git tag --force 1.0 $env:GITHUB_SHA
            git push origin refs/tags/1.0 --force
            if ($LASTEXITCODE -ne 0) { throw "Moving the release tag failed." }
            gh release edit 1.0 --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Dewral Map Editor $env:RELEASE_VERSION" --notes-file "release/release-notes.md" --latest
            if ($LASTEXITCODE -ne 0) { throw "Updating the release metadata failed." }
            gh release upload 1.0 @assets --repo $env:GITHUB_REPOSITORY --clobber
            if ($LASTEXITCODE -ne 0) { throw "Uploading the release assets failed." }
          } else {
            gh release create 1.0 @assets --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Dewral Map Editor $env:RELEASE_VERSION" --notes-file "release/release-notes.md" --latest
            if ($LASTEXITCODE -ne 0) { throw "Creating the release failed." }
          }
          # Advertise the new version only after its archives are available.
          gh release upload 1.0 "release/update-manifest.json" --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw "Uploading the update manifest failed." }
